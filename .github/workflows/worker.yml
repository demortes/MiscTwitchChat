# Tests the Cloudflare Worker on every change and deploys it from main.
#
# Deploying needs three repository secrets (Settings > Secrets and variables > Actions):
#   CLOUDFLARE_API_TOKEN         API token allowed to edit Workers scripts and D1 databases
#   CLOUDFLARE_ACCOUNT_ID        your Cloudflare account ID
#   CLOUDFLARE_D1_DATABASE_ID    the database_id printed by `wrangler d1 create misctwitchchat`
#
# The IDs are kept as secrets on purpose: worker/wrangler.jsonc is gitignored, so this workflow builds it from
# worker/wrangler.example.jsonc at deploy time. A fork without these secrets still runs the tests and simply
# skips the deploy. Worker runtime secrets (OPEN_AI_KEY, ...) are set once with `wrangler secret put` and
# persist across deploys, so they are not handled here. See worker/README.md.

name: Test and deploy the Cloudflare Worker

on:
  push:
    branches: ['main']
    paths:
      - 'worker/**'
      - '.github/workflows/worker.yml'
  pull_request:
    paths:
      - 'worker/**'
      - '.github/workflows/worker.yml'
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: worker

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      # Proves the Worker bundles and the config is valid, without touching Cloudflare. The placeholder
      # database id is fine because a dry run never contacts the account.
      - name: Bundle (dry run)
        run: |
          cp wrangler.example.jsonc wrangler.jsonc
          npx wrangler deploy --dry-run --outdir "$RUNNER_TEMP/worker-dry-run"

  deploy:
    needs: test
    # Pull requests only test. Deploys come from main, or when someone runs the workflow by hand on main.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # Never run two deploys (or migrations) at once, and let a running one finish instead of cancelling it.
    concurrency:
      group: worker-deploy
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
    steps:
      - name: Check Cloudflare secrets are configured
        id: cf
        shell: bash
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ] && [ -n "$D1_DATABASE_ID" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID or CLOUDFLARE_D1_DATABASE_ID is not set, so the deploy was skipped."
          fi

      - name: Checkout repository
        if: steps.cf.outputs.configured == 'true'
        uses: actions/checkout@v4

      - name: Set up Node.js
        if: steps.cf.outputs.configured == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - name: Install dependencies
        if: steps.cf.outputs.configured == 'true'
        run: npm ci

      - name: Create wrangler.jsonc from the template
        if: steps.cf.outputs.configured == 'true'
        run: sed "s/REPLACE_WITH_YOUR_D1_DATABASE_ID/${D1_DATABASE_ID}/" wrangler.example.jsonc > wrangler.jsonc

      # Migrations go first so the new code never runs against an older schema.
      - name: Apply D1 migrations
        if: steps.cf.outputs.configured == 'true'
        run: npx wrangler d1 migrations apply misctwitchchat --remote

      - name: Deploy Worker
        if: steps.cf.outputs.configured == 'true'
        run: npx wrangler deploy
